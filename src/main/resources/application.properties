spring.application.name=Interview_code_assesement

# PostgreSQL Configuration
# NOTE: For production, externalize these credentials to environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# SECURITY WARNING: Change this secret in production and externalize to environment variables
# The secret must be at least 256 bits (32 characters) for HS256 algorithm
jwt.secret=your-256-bit-secret-key-change-this-in-production-your-256-bit-secret-key-change-this
jwt.expiration=86400000

# Disable Datadog metrics export
management.datadog.metrics.export.enabled=false
